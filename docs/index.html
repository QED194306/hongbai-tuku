<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红白图库</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 32px 20px 64px;
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #fafafa;
    color: #222;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e8e8e8; }
    a { color: #7ab8ff; }
    figure { background: #1e2127; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 28px; opacity: .65; font-size: 13px; }
  figure {
    margin: 0 0 28px; padding: 12px; border-radius: 10px;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  figure img { display: block; width: 100%; height: auto; border-radius: 4px; }
  figcaption { margin-top: 10px; font-size: 13px; opacity: .7; }
  a { color: #0a58ca; }
</style>
</head>
<body>
  <h1>红白图库</h1>
  <p class="lead">点击图片可查看完整尺寸。用于 AO3 外链引用。</p>

  <figure>
    <a href="light.png"><img src="light.png" alt="浅色版"></a>
    <figcaption>浅色版 &middot; <a href="light.png">light.png</a></figcaption>
  </figure>

  <figure>
    <a href="dark.png"><img src="dark.png" alt="深色版"></a>
    <figcaption>深色版 &middot; <a href="dark.png">dark.png</a></figcaption>
  </figure>

  <figure>
    <a href="preview.jpg"><img src="preview.jpg" alt="预览图"></a>
    <figcaption>预览图 &middot; <a href="preview.jpg">preview.jpg</a></figcaption>
  </figure>
</body>
</html>
